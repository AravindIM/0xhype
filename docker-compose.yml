services:
  db:
    image: postgres:18.1-alpine3.23
    container_name: 0xhype-db
    shm_size: 128mb
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-0xhype}"
      POSTGRES_USER: "${POSTGRES_USER:-0xhype}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - 0xhype-network
    restart: unless-stopped

  web-dev:
    build:
      context: ./app/web
      dockerfile: Dockerfile
      target: development
    container_name: 0xhype-web-dev
    ports:
      - '${VITE_PORT:-5173}:5173'
    environment:
      NODE_ENV: development
      DOCKER_ENV: 'true'
    volumes:
      - ./app/web/app:/app/app:ro
      - ./app/web/package.json:/app/package.json:ro
      - ./app/web/tsconfig.json:/app/tsconfig.json:ro
      - ./app/web/components.json:/app/components.json:ro
      - ./app/web/vite.config.ts:/app/vite.config.ts:ro
      - ./app/web/public:/app/public:ro
    develop:
      watch:
        - action: sync
          path: ./app/web/app
          target: /app/app
          ignore:
            - '**/*.test.*'
            - '**/__tests__/**'
        - action: rebuild
          path: ./app/web/package.json
        - action: sync
          path: ./app/web/components.json
          target: /app/components.json
        - action: rebuild
          path: ./app/web/tsconfig.json
          target: /app/tsconfig.json
        - action: rebuild
          path: ./app/web/vite.config.ts
          target: /app/vite.config.ts
        - action: sync
          path: /app/public
          target: ./app/web/public
    restart: unless-stopped
    networks:
      - 0xhype-network

  api-dev:
    build:
      context: ./app/api
      dockerfile: Dockerfile
      target: development
    container_name: 0xhype-api-dev
    ports:
      - "${APP_PORT:-3000}:3000" # NestJS API server
      - "${DEBUG_PORT:-9229}:9229" # Node.js debugger
    environment:
      NODE_ENV: development
      DOCKER_ENV: 'true'
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: "${POSTGRES_DB:-0xhype}"
      POSTGRES_USER: "${POSTGRES_USER:-0xhype}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}'
      JWT_SECRET: '${JWT_SECRET:-change-me-in-production}'
    volumes:
      - ./app/api/src:/app/src:ro
      - ./app/api/test:/app/test:ro
      - ./app/api/package.json:/app/package.json:ro
      - ./app/api/package-lock.json:/app/package-lock.json:ro
      - ./app/api/nest-cli.json:/app/nest-cli.json:ro
      - ./app/api/tsconfig.json:/app/tsconfig.json:ro
      - ./app/api/tsconfig.build.json:/app/tsconfig.build.json:ro
    develop:
      watch:
        - action: sync
          path: ./app/api/src
          target: /app/src 
        - action: sync
          path: ./app/api/test
          target: /app/test
        - action: rebuild
          path: ./app/api/package.json
        - action: rebuild
          path: ./app/api/package-lock.json
        - action: sync
          path: ./app/api/nest-cli.json
          target: /app/nest-cli.json
        - action: sync
          path: ./app/api/tsconfig.json
          target: /app/tsconfig.json
        - action: sync
          path: ./app/api/tsconfig.build.json
          target: /app/tsconfig.build.json
    restart: unless-stopped
    networks:
      - 0xhype-network

volumes:
  pgdata:


networks:
  0xhype-network:
