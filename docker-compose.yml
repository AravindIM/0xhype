services:
  db:
    image: postgres:18.1-alpine3.23
    container_name: hype0-db
    shm_size: 128mb
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-hype0}"
      POSTGRES_USER: "${POSTGRES_USER:-hype0}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - hype0-network
    restart: unless-stopped

  web-dev:
    build:
      context: ./app/web
      dockerfile: Dockerfile
      target: development
    container_name: hype0-web-dev
    ports:
      - '${VITE_PORT:-5173}:5173'
    environment:
      NODE_ENV: development
      DOCKER_ENV: 'true'
    volumes:
      - ./app/web/app:/app/app:ro
      - ./app/web/package.json:/app/package.json:ro
      - ./app/web/tsconfig.json:/app/tsconfig.json:ro
      - ./app/web/components.json:/app/components.json:ro
      - ./app/web/vite.config.ts:/app/vite.config.ts:ro
    develop:
      watch:
        - action: sync
          path: ./app/web/app
          target: /app/app
          ignore:
            - '**/*.test.*'
            - '**/__tests__/**'
        - action: rebuild
          path: ./app/web/package.json
        - action: sync
          path: ./app/web/components.json
          target: /app/components.json
        - action: rebuild
          path: ./app/web/tsconfig.json
          target: /app/tsconfig.json
        - action: rebuild
          path: ./app/web/vite.config.ts
          target: /app/vite.config.ts
    restart: unless-stopped
    networks:
      - hype0-network

  api-dev:
    build:
      context: ./app/api
      dockerfile: Dockerfile
      target: development
    container_name: hype0-api-dev
    ports:
      - "${APP_PORT:-3000}:3000" # NestJS API server
      - "${DEBUG_PORT:-9229}:9229" # Node.js debugger
    environment:
      NODE_ENV: development
      DOCKER_ENV: 'true'
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: "${POSTGRES_DB:-hype0}"
      POSTGRES_USER: "${POSTGRES_USER:-hype0}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}'
    volumes:
      - ./app/api/src:/app/src:ro
      - ./app/api/test:/app/test:ro
      - ./app/api/package.json:/app/package.json:ro
      - ./app/api/package-lock.json:/app/package-lock.json:ro
      - ./app/api/nest-cli.json:/app/nest-cli.json:ro
      - ./app/api/tsconfig.json:/app/tsconfig.json:ro
      - ./app/api/tsconfig.build.json:/app/tsconfig.build.json:ro
    develop:
      watch:
        - action: sync
          path: ./test
          target: /app/test
        - action: rebuild
          path: ./package.json
        - action: sync
          path: ./nest-cli.json
          target: /app/nest-cli.json
        - action: sync
          path: ./tsconfig.json
          target: /app/tsconfig.json
        - action: sync
          path: ./tsconfig.build.json
          target: /app/tsconfig.build.json
    restart: unless-stopped
    networks:
      - hype0-network

volumes:
  pgdata:


networks:
  hype0-network:
