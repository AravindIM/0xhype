services:
  minio:
    image: minio/minio:latest
    container_name: 0xhype-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - miniodata:/data
    networks:
      - 0xhype-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: 0xhype-redis
    networks:
      - 0xhype-network
    restart: unless-stopped

  db:
    image: postgres:18.1-alpine3.23
    container_name: 0xhype-db
    shm_size: 128mb
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-0xhype}"
      POSTGRES_USER: "${POSTGRES_USER:-0xhype}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - 0xhype-network
    restart: unless-stopped

  web-dev:
    build:
      context: ./app/web
      dockerfile: Dockerfile
      target: development
    container_name: 0xhype-web-dev
    ports:
      - '${VITE_PORT:-5173}:5173'
    environment:
      NODE_ENV: development
      DOCKER_ENV: 'true'
    develop:
      watch:
        - action: sync
          path: ./app/web/app
          target: /app/app
          ignore:
            - '**/*.test.*'
            - '**/__tests__/**'
        - action: rebuild
          path: ./app/web/package.json
        - action: sync
          path: ./app/web/components.json
          target: /app/components.json
        - action: rebuild
          path: ./app/web/tsconfig.json
          target: /app/tsconfig.json
        - action: rebuild
          path: ./app/web/vite.config.ts
          target: /app/vite.config.ts
        - action: sync
          path: /app/public
          target: ./app/web/public
    restart: unless-stopped
    networks:
      - 0xhype-network

  api-dev:
    build:
      context: ./app/api
      dockerfile: Dockerfile
      target: development
    container_name: 0xhype-api-dev
    ports:
      - "${APP_PORT:-3000}:3000" # NestJS API server
      - "${DEBUG_PORT:-9229}:9229" # Node.js debugger
    environment:
      NODE_ENV: development
      DOCKER_ENV: 'true'
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: "${POSTGRES_DB:-0xhype}"
      POSTGRES_USER: "${POSTGRES_USER:-0xhype}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}'
      JWT_SECRET: '${JWT_SECRET:-change-me-in-production}'
      REDIS_URL: 'redis://redis:6379'
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: '${MINIO_ACCESS_KEY:-minioadmin}'
      MINIO_SECRET_KEY: '${MINIO_SECRET_KEY:-minioadmin}'
      MINIO_BUCKET: '${MINIO_BUCKET:-avatars}'
      MINIO_PUBLIC_URL: '${MINIO_PUBLIC_URL:-http://localhost:9000}'
    develop:
      watch:
        - action: sync
          path: ./app/api/src
          target: /app/src 
        - action: sync
          path: ./app/api/test
          target: /app/test
        - action: rebuild
          path: ./app/api/package.json
        - action: rebuild
          path: ./app/api/package-lock.json
        - action: sync
          path: ./app/api/nest-cli.json
          target: /app/nest-cli.json
        - action: sync
          path: ./app/api/tsconfig.json
          target: /app/tsconfig.json
        - action: sync
          path: ./app/api/tsconfig.build.json
          target: /app/tsconfig.build.json
    depends_on:
      - db
      - redis
      - minio
    restart: unless-stopped
    networks:
      - 0xhype-network

volumes:
  pgdata:
  miniodata:


networks:
  0xhype-network:
